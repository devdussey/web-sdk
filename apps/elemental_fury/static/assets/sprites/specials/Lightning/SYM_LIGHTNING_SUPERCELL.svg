<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Heavy Storm Shadow Filter -->
    <filter id="lightningShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Supercharged Arc Glow Filter -->
    <filter id="electricGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Storm Chassis Gradient -->
    <linearGradient id="stormTileChassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D0FE" />
      <stop offset="30%" stop-color="#A855F7" />
      <stop offset="70%" stop-color="#581C87" />
      <stop offset="100%" stop-color="#1E0538" />
    </linearGradient>

    <!-- Lightning Bolt Core Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#F0ABFC" />
      <stop offset="75%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>

    <!-- Dark Center Plasma Basin -->
    <radialGradient id="plasmaBasin" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B0764" />
      <stop offset="65%" stop-color="#1E0538" />
      <stop offset="100%" stop-color="#0F021C" />
    </radialGradient>
  </defs>

  <!-- 1. Diamond Storm Conduit Chassis -->
  <g filter="url(#lightningShadow)">
    <!-- Outer Diamond Plaque -->
    <polygon points="100,10 190,100 100,190 10,100" fill="url(#stormTileChassis)" stroke="#1E0538" stroke-width="4" />

    <!-- Inner Metallic Diamond Rim -->
    <polygon points="100,24 176,100 100,176 24,100" fill="url(#plasmaBasin)" stroke="#C084FC" stroke-width="2.5" />
  </g>

  <!-- 2. Electric Lightning Bolt Conduits -->
  <g filter="url(#electricGlow)">
    <!-- Primary Multiplier Lightning Strike -->
    <polygon points="
      115,35
      80,95
      105,95
      75,165
      130,90
      102,90
    " fill="url(#boltGrad)" stroke="#FFFFFF" stroke-width="2" />

    <!-- Secondary Ion Sparks -->
    <path d="M45,85 L60,95 L40,110" fill="none" stroke="#F5D0FE" stroke-width="2.5" stroke-linecap="round" />
    <path d="M155,85 L140,95 L160,110" fill="none" stroke="#F5D0FE" stroke-width="2.5" stroke-linecap="round" />
    <path d="M90,30 L100,45 L110,30" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <path d="M90,170 L100,155 L110,170" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- 3. Corner Arc Nodules -->
  <circle cx="100" cy="18" r="4" fill="#FFFFFF" filter="url(#electricGlow)" />
  <circle cx="182" cy="100" r="4" fill="#FFFFFF" filter="url(#electricGlow)" />
  <circle cx="100" cy="182" r="4" fill="#FFFFFF" filter="url(#electricGlow)" />
  <circle cx="18" cy="100" r="4" fill="#FFFFFF" filter="url(#electricGlow)" />
</svg>

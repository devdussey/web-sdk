<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Heavy Glacial Shadow Filter -->
    <filter id="iceShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Frost Bloom Glow Filter -->
    <filter id="frostGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Hexagonal Chassis Gradient -->
    <linearGradient id="iceHexChassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="30%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#082F49" />
    </linearGradient>

    <!-- Deep Crystalline Abyss Gradient -->
    <radialGradient id="iceAbyss" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0369A1" />
      <stop offset="85%" stop-color="#075985" />
      <stop offset="100%" stop-color="#082F49" />
    </radialGradient>

    <!-- Crystal Spire Highlights -->
    <linearGradient id="crystalFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- 1. Hexagonal Glacial Crystal Chassis -->
  <g filter="url(#iceShadow)">
    <!-- Outer Heavy Hexagon Bezel -->
    <polygon points="100,10 180,55 180,145 100,190 20,145 20,55" fill="url(#iceHexChassis)" stroke="#082F49" stroke-width="4" />

    <!-- Inner Crystalline Basin -->
    <polygon points="100,24 168,62 168,138 100,176 32,138 32,62" fill="url(#iceAbyss)" stroke="#7DD3FC" stroke-width="2.5" />
  </g>

  <!-- 2. Chiseled Glacial Shard Crystal Clusters -->
  <g filter="url(#frostGlow)">
    <!-- Central Sharp Glacial Spire -->
    <polygon points="100,30 125,100 100,165 75,100" fill="url(#crystalFacet)" stroke="#E0F2FE" stroke-width="2" />
    <polygon points="100,30 100,165 75,100" fill="#E0F2FE" opacity="0.6" />

    <!-- Left Crystal Shard -->
    <polygon points="48,70 82,95 72,135 42,105" fill="#38BDF8" stroke="#E0F2FE" stroke-width="1.5" />
    <!-- Right Crystal Shard -->
    <polygon points="152,70 158,105 128,135 118,95" fill="#38BDF8" stroke="#E0F2FE" stroke-width="1.5" />
  </g>

  <!-- 3. Runic Dendritic Snowflake Sigils -->
  <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" filter="url(#frostGlow)">
    <line x1="100" y1="45" x2="100" y2="155" />
    <line x1="50" y1="72" x2="150" y2="128" />
    <line x1="50" y1="128" x2="150" y2="72" />
  </g>

  <!-- 4. Corner Frost Points -->
  <circle cx="100" cy="18" r="3.5" fill="#FFFFFF" />
  <circle cx="174" cy="60" r="3.5" fill="#FFFFFF" />
  <circle cx="174" cy="140" r="3.5" fill="#FFFFFF" />
  <circle cx="100" cy="182" r="3.5" fill="#FFFFFF" />
  <circle cx="26" cy="140" r="3.5" fill="#FFFFFF" />
  <circle cx="26" cy="60" r="3.5" fill="#FFFFFF" />
</svg>

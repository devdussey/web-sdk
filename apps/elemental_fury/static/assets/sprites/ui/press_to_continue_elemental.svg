<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="100%">
  <defs>
    <!-- Master Drop Shadow Filter -->
    <filter id="plaqueShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <!-- Neon Glow Filter -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Plaque Background Gradient -->
    <linearGradient id="plaqueBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#020617" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0.95" />
    </linearGradient>

    <!-- Gold Inlay Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="25%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FEF08A" />
      <stop offset="75%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- 1. Plaque Chassis with Drop Shadow -->
  <g filter="url(#plaqueShadow)">
    <!-- Outer Octagonal Dark Plaque -->
    <polygon points="
      30,10  770,10
      790,30  790,90
      770,110  30,110
      10,90   10,30
    " fill="url(#plaqueBg)" stroke="#1E293B" stroke-width="2" />

    <!-- Inner Elemental Filigree Border -->
    <polygon points="
      40,20  760,20
      778,38  778,82
      760,100  40,100
      22,82   22,38
    " fill="none" stroke="url(#goldBorder)" stroke-width="2" />
  </g>

  <!-- 2. Four Elemental Corner Accent Gems -->
  <!-- Top-Left Ice Gem -->
  <polygon points="30,20 36,26 30,32 24,26" fill="#38BDF8" filter="url(#textGlow)" />
  <!-- Top-Right Fire Gem -->
  <polygon points="770,20 776,26 770,32 764,26" fill="#F97316" filter="url(#textGlow)" />
  <!-- Bottom-Left Storm Gem -->
  <polygon points="30,100 36,94 30,88 24,94" fill="#C084FC" filter="url(#textGlow)" />
  <!-- Bottom-Right Wind Gem -->
  <polygon points="770,100 776,94 770,88 764,94" fill="#2DD4BF" filter="url(#textGlow)" />

  <!-- 3. Primary Banner Typography -->
  <text x="400" y="58" font-family="'Outfit', 'Proxima Nova', 'Segoe UI', sans-serif" font-size="26" font-weight="900" letter-spacing="6" fill="url(#goldText)" text-anchor="middle" filter="url(#textGlow)">
    PRESS ANYWHERE TO CONTINUE
  </text>

  <!-- Subtitle Hint -->
  <text x="400" y="86" font-family="'Outfit', 'Proxima Nova', 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#94A3B8" text-anchor="middle">
    OR PRESS [SPACE]
  </text>
</svg>

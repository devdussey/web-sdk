<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1200" width="100%" height="100%">
  <defs>
    <!-- Heavy Chassis Shadow -->
    <filter id="chassisDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <!-- Elemental Rune Glow Filter -->
    <filter id="runeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Bezel Meteoric Metallic Gradients -->
    <linearGradient id="bezelOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="25%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="bezelHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#475569" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>

    <!-- Inner Reel Window Backing (Translucent dark slate glass for depth & background integration) -->
    <radialGradient id="reelWindowBacking" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.70" />
      <stop offset="60%" stop-color="#070C18" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.90" />
    </radialGradient>

    <!-- Corner Rune Gradients -->
    <!-- Top-Left: Subzero Ice -->
    <linearGradient id="cornerIce" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Top-Right: Wildfire Fire -->
    <linearGradient id="cornerFire" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>

    <!-- Bottom-Left: Supercell Lightning -->
    <linearGradient id="cornerStorm" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <!-- Bottom-Right: Maelstrom Wind -->
    <linearGradient id="cornerWind" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#5EEAD4" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
  </defs>

  <!-- ========================================================================= -->
  <!-- 1. MAIN OUTER CHASSIS (Transparent Glassmorphic Rim with Subtle Drop Shadow) -->
  <!-- ========================================================================= -->
  <g filter="url(#chassisDropShadow)">
    <!-- Outer Translucent Glowing Border -->
    <polygon points="
      80,30  1360,30
      1410,80  1410,1120
      1360,1170  80,1170
      30,1120  30,80
    " fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="2" />

    <!-- Subtle Inner Bevel Stroke -->
    <polygon points="
      100,50  1340,50
      1390,100  1390,1100
      1340,1150  100,1150
      50,1100  50,100
    " fill="none" stroke="url(#bezelHighlight)" stroke-opacity="0.5" stroke-width="1.5" />
  </g>

  <!-- ========================================================================= -->
  <!-- 2. INNER 6x5 REEL BACKING WINDOW (1200 x 1000 Exact Symbol Area)          -->
  <!-- ========================================================================= -->
  <!-- Inner Window: Translucent dark glass letting cosmic void show through -->
  <rect x="120" y="100" width="1200" height="1000" rx="12" fill="url(#reelWindowBacking)" stroke="#38BDF8" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- Subtle Vertical Column Divider Lines (6 Columns of 200px each) -->
  <g stroke="#1E293B" stroke-width="1.5" opacity="0.65">
    <line x1="320" y1="100" x2="320" y2="1100" />
    <line x1="520" y1="100" x2="520" y2="1100" />
    <line x1="720" y1="100" x2="720" y2="1100" />
    <line x1="920" y1="100" x2="920" y2="1100" />
    <line x1="1120" y1="100" x2="1120" y2="1100" />
  </g>

  <!-- Horizontal Reel Guideline Accents (5 Rows of 200px each) -->
  <g stroke="#0F172A" stroke-width="1" opacity="0.5">
    <line x1="120" y1="300" x2="1320" y2="300" />
    <line x1="120" y1="500" x2="1320" y2="500" />
    <line x1="120" y1="700" x2="1320" y2="700" />
    <line x1="120" y1="900" x2="1320" y2="900" />
  </g>

  <!-- Column Header Indicator Notches -->
  <g fill="#475569">
    <polygon points="315,95 325,95 320,105" />
    <polygon points="515,95 525,95 520,105" />
    <polygon points="715,95 725,95 720,105" />
    <polygon points="915,95 925,95 920,105" />
    <polygon points="1115,95 1125,95 1120,105" />

    <polygon points="315,1105 325,1105 320,1095" />
    <polygon points="515,1105 525,1105 520,1095" />
    <polygon points="715,1105 725,1105 720,1095" />
    <polygon points="915,1105 925,1105 920,1095" />
    <polygon points="1115,1105 1125,1105 1120,1095" />
  </g>

  <!-- ========================================================================= -->
  <!-- 3. FOUR ELEMENTAL CORNER RUNES & CLASPS                                   -->
  <!-- ========================================================================= -->
  <!-- TOP-LEFT: Subzero Frost Clasp -->
  <g id="clasp-subzero">
    <polygon points="30,80 120,30 200,30 120,110 30,200 30,80" fill="url(#cornerIce)" stroke="#E0F2FE" stroke-width="2" filter="url(#runeGlow)" />
    <!-- Subzero Snowflake Rune Icon -->
    <path d="M75,75 L115,115 M115,75 L75,115 M95,65 L95,125 M65,95 L125,95" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="95" cy="95" r="4" fill="#38BDF8" />
  </g>

  <!-- TOP-RIGHT: Wildfire Magma Clasp -->
  <g id="clasp-wildfire">
    <polygon points="1410,80 1320,30 1240,30 1320,110 1410,200 1410,80" fill="url(#cornerFire)" stroke="#FEF08A" stroke-width="2" filter="url(#runeGlow)" />
    <!-- Wildfire Flame Rune Icon -->
    <path d="M1345,120 Q1335,95 1350,80 Q1355,95 1365,70 Q1375,100 1355,125 Q1335,125 1345,120 Z" fill="#FEF08A" stroke="#DC2626" stroke-width="1.5" />
    <circle cx="1345" cy="95" r="4" fill="#FFAA00" />
  </g>

  <!-- BOTTOM-LEFT: Supercell Storm Clasp -->
  <g id="clasp-supercell">
    <polygon points="30,1120 120,1170 200,1170 120,1090 30,1000 30,1120" fill="url(#cornerStorm)" stroke="#F5D0FE" stroke-width="2" filter="url(#runeGlow)" />
    <!-- Supercell Lightning Rune Icon -->
    <path d="M90,1065 L105,1090 L95,1095 L110,1125 L95,1105 L102,1100 Z" fill="#FFFFFF" stroke="#C084FC" stroke-width="1.5" />
    <circle cx="95" cy="1105" r="4" fill="#C084FC" />
  </g>

  <!-- BOTTOM-RIGHT: Maelstrom Wind Clasp -->
  <g id="clasp-maelstrom">
    <polygon points="1410,1120 1320,1170 1240,1170 1320,1090 1410,1000 1410,1120" fill="url(#cornerWind)" stroke="#F0FDFA" stroke-width="2" filter="url(#runeGlow)" />
    <!-- Maelstrom Cyclone Spiral Icon -->
    <path d="M1330,1110 Q1345,1090 1360,1105 T1340,1125 T1335,1105" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="1345" cy="1105" r="4" fill="#5EEAD4" />
  </g>

  <!-- ========================================================================= -->
  <!-- 4. HEADER EMBLEM / PLAQUE                                                 -->
  <!-- ========================================================================= -->
  <g id="header-plaque" filter="url(#chassisDropShadow)">
    <!-- Header Backing Plaque -->
    <polygon points="560,30 880,30 910,75 880,95 560,95 530,75" fill="#0B111E" fill-opacity="0.4" stroke="#475569" stroke-opacity="0.5" stroke-width="2" />
    <polygon points="580,40 860,40 880,72 860,85 580,85 560,72" fill="#030712" fill-opacity="0.5" stroke="#1E293B" stroke-opacity="0.4" stroke-width="1.5" />

    <!-- Central Prismatic Gemstone -->
    <polygon points="720,42 735,57 720,72 705,57" fill="#E0F2FE" stroke="#38BDF8" stroke-width="1.5" filter="url(#runeGlow)" />
    <circle cx="720" cy="57" r="3.5" fill="#F97316" />

    <!-- Left / Right Gold Filigree Lines -->
    <line x1="600" y1="57" x2="695" y2="57" stroke="#FBBF24" stroke-opacity="0.8" stroke-width="1.5" />
    <line x1="745" y1="57" x2="840" y2="57" stroke="#FBBF24" stroke-opacity="0.8" stroke-width="1.5" />
  </g>
</svg>

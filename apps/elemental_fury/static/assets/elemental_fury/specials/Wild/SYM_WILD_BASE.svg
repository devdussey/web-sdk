<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Intense Cosmic Bloom Filter -->
    <filter id="riftGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Deep Space Vacuum Backdrop -->
    <radialGradient id="spaceVoid" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#05030A" />
      <stop offset="60%" stop-color="#020106" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- 1. Molten Fire Ribbon Gradient (Bottom-Left Stream) -->
    <linearGradient id="fireRibbon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="40%" stop-color="#EA580C" />
      <stop offset="80%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>

    <!-- 2. Electric Violet / Magenta Ribbon Gradient -->
    <linearGradient id="purpleRibbon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B0764" />
      <stop offset="35%" stop-color="#7E22CE" />
      <stop offset="70%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <!-- 3. Glacial Cyan / Electric Blue Ribbon Gradient (Top & Right Vortex) -->
    <linearGradient id="cyanRibbon" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="30%" stop-color="#0284C7" />
      <stop offset="65%" stop-color="#38BDF8" />
      <stop offset="90%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- 4. Inner Accretion Rim Glow -->
    <radialGradient id="rimGlow" cx="50%" cy="50%" r="50%">
      <stop offset="75%" stop-color="#000000" stop-opacity="0" />
      <stop offset="88%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="96%" stop-color="#F472B6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </radialGradient>
  </defs>

  <!-- Tile Canvas Base -->
  <rect width="512" height="512" fill="url(#spaceVoid)" rx="32" />
  <rect x="20" y="20" width="472" height="472" rx="24" fill="none" stroke="#18181B" stroke-width="3" stroke-dasharray="8, 6" />

  <!-- SCATTERED COSMIC STAR DUST / SPARKS -->
  <g fill="#FFFFFF" opacity="0.7">
    <circle cx="90" cy="120" r="1.5" />
    <circle cx="140" cy="80" r="1" />
    <circle cx="430" cy="90" r="1.5" />
    <circle cx="400" cy="60" r="2" />
    <circle cx="450" cy="140" r="1" />
    <circle cx="460" cy="380" r="1.5" />
    <circle cx="420" cy="430" r="1" />
    <circle cx="80" cy="400" r="2" />
    <circle cx="110" cy="450" r="1.5" />
    <circle cx="60" cy="270" r="1" />
  </g>

  <!-- LAYER 1: OUTER PURPLE / MAGENTA NEBULA TENDRILS -->
  <path d="M 40 400 C 20 280 80 160 160 90 C 240 20 380 40 450 110 C 370 70 260 70 190 120 C 110 180 80 280 110 390 Z" 
        fill="url(#purpleRibbon)" opacity="0.75" filter="url(#riftGlow)" />
  <path d="M 60 440 C 130 490 270 490 370 440 C 440 400 480 330 490 250 C 450 320 390 380 310 410 C 220 440 120 420 60 440 Z" 
        fill="url(#purpleRibbon)" opacity="0.6" />

  <!-- LAYER 2: FIERY MOLTEN ORANGE INFLOW (Bottom-Left into Singularity) -->
  <path d="M 20 460 C 80 470 170 450 240 400 C 310 350 340 280 330 220 C 320 270 280 320 220 350 C 150 390 70 380 20 360 C 10 400 10 430 20 460 Z" 
        fill="url(#fireRibbon)" filter="url(#riftGlow)" />
  <!-- Inner Intense Magma Stream Tongue -->
  <path d="M 70 410 C 130 420 190 390 240 340 C 270 300 285 260 280 220 C 265 260 235 295 190 320 C 140 350 85 360 70 410 Z" 
        fill="#FEF08A" opacity="0.9" filter="url(#riftGlow)" />

  <!-- LAYER 3: BLINDING CYAN & GLACIAL BLUE SPIRAL STREAMS -->
  <!-- Outer Main Sweeping Arm (Wrapping counter-clockwise from top to right) -->
  <path d="M 120 80 C 220 10 360 20 440 90 C 510 160 500 280 430 370 C 470 280 460 170 390 110 C 320 50 210 50 120 80 Z" 
        fill="url(#cyanRibbon)" filter="url(#riftGlow)" />

  <!-- Mid Spiraling Filament (Diving steeply into the dark core) -->
  <path d="M 180 110 C 280 70 390 100 420 190 C 440 260 400 340 330 370 C 390 320 400 240 370 180 C 330 120 250 100 180 110 Z" 
        fill="url(#cyanRibbon)" filter="url(#riftGlow)" />

  <!-- Tight Glacial Inflow Arm (Whistling around the event horizon) -->
  <path d="M 230 135 C 310 130 370 170 375 240 C 380 300 330 355 265 360 C 320 340 345 290 335 240 C 320 180 275 155 230 135 Z" 
        fill="#FFFFFF" filter="url(#riftGlow)" />

  <!-- Fast Inner Plasma Whisps -->
  <path d="M 210 160 C 270 155 315 185 320 235 C 310 195 270 175 210 160 Z" fill="#BAE6FD" filter="url(#riftGlow)" />
  <path d="M 330 270 C 320 310 280 340 235 335 C 270 325 295 300 300 270 Z" fill="#F472B6" filter="url(#riftGlow)" />

  <!-- LAYER 4: THE EVENT HORIZON SINGULARITY (Pure Black Hole Core) -->
  <!-- Outer Accretion Glow Rim -->
  <circle cx="256" cy="256" r="92" fill="url(#rimGlow)" filter="url(#riftGlow)" />
  <!-- Pure Void Core -->
  <circle cx="256" cy="256" r="80" fill="#000000" stroke="#000000" stroke-width="4" />

  <!-- Razor Thin Photon Orbit Ring -->
  <circle cx="256" cy="256" r="82" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9" filter="url(#riftGlow)" />

  <!-- LAYER 5: CHISELED COMIC "W" EMBLEM (Integrated into the Singularity) -->
  <!-- Heavy Shadow Drop for Instant Cell Readability -->
  <path d="M 195 190 L 225 315 L 256 240 L 287 315 L 317 190 L 292 190 L 273 270 L 256 215 L 239 270 L 220 190 Z" 
        fill="#000000" stroke="#000000" stroke-width="12" stroke-linejoin="miter" />
        
  <!-- Glowing Celestial Silver / White-Hot Core "W" -->
  <path d="M 195 190 L 225 315 L 256 240 L 287 315 L 317 190 L 292 190 L 273 270 L 256 215 L 239 270 L 220 190 Z" 
        fill="#FFFFFF" stroke="#38BDF8" stroke-width="3" stroke-linejoin="miter" filter="url(#riftGlow)" />

  <!-- "W" Inner Facet Chisel Line -->
  <polyline points="225,310 256,245 287,310" fill="none" stroke="#F472B6" stroke-width="2" stroke-linecap="round" />
  <polyline points="200,195 220,290" fill="none" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round" />
  <polyline points="312,195 292,290" fill="none" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round" />

  <!-- COMIC INK ACCENT SLASHES (Hacksaw Contour Slices) -->
  <g stroke="#000000" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M 150 100 C 210 65 290 65 350 90" />
    <path d="M 390 140 C 430 190 435 260 405 320" />
    <path d="M 310 400 C 230 435 140 425 70 380" />
    <path d="M 170 350 C 210 375 250 370 280 350" />
  </g>

  <!-- FOREGROUND HIGH-VELOCITY PLASMA SPARKS -->
  <circle cx="210" cy="140" r="3.5" fill="#FFFFFF" filter="url(#riftGlow)" />
  <circle cx="370" cy="160" r="3" fill="#38BDF8" filter="url(#riftGlow)" />
  <circle cx="340" cy="350" r="3.5" fill="#F472B6" filter="url(#riftGlow)" />
  <circle cx="260" cy="380" r="4" fill="#F97316" filter="url(#riftGlow)" />
  <circle cx="150" cy="370" r="3" fill="#FDE047" filter="url(#riftGlow)" />
  <circle cx="160" cy="180" r="2.5" fill="#BAE6FD" filter="url(#riftGlow)" />
</svg>

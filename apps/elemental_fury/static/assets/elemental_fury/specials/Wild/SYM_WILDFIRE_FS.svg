<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Intense Volcanic Bloom Filter -->
    <filter id="eruptionGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Deep Charred Ash Background -->
    <radialGradient id="ashVoid" cx="50%" cy="60%" r="65%">
      <stop offset="0%" stop-color="#3B0808" />
      <stop offset="50%" stop-color="#140202" />
      <stop offset="100%" stop-color="#050000" />
    </radialGradient>

    <!-- Explosive Blast Center Radial Gradient -->
    <radialGradient id="blastCenter" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FEF08A" />
      <stop offset="55%" stop-color="#F97316" />
      <stop offset="85%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#450A0A" />
    </radialGradient>

    <!-- Upward Spreading Eruption Flame Column -->
    <linearGradient id="flameErupt" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="20%" stop-color="#DC2626" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="80%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#FFFBEB" />
    </linearGradient>

    <!-- Spreading Sticky Magma Tendrils Gradient -->
    <linearGradient id="stickyMagma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>
  </defs>

  <!-- Tile Canvas Base -->
  <rect width="512" height="512" fill="url(#ashVoid)" rx="32" />
  
  <!-- BURNT TILE BORDER WITH FRACTURING HEAT -->
  <rect x="20" y="20" width="472" height="472" rx="24" fill="none" stroke="#7F1D1D" stroke-width="4" stroke-dasharray="14, 8" />

  <!-- BLAST AURA & SMOKE PLUME -->
  <circle cx="256" cy="270" r="180" fill="url(#blastCenter)" opacity="0.6" filter="url(#eruptionGlow)" />

  <!-- ==========================================
       1. SPREADING FLAME WINGS (Expanding Outward to Borders)
       ========================================== -->
  <!-- Left Spreading Surge -->
  <path d="M 230 360 C 130 380 40 320 20 220 C 10 160 50 120 80 80 C 80 150 140 190 190 230 Z" 
        fill="url(#flameErupt)" stroke="#000000" stroke-width="7" stroke-linejoin="round" filter="url(#eruptionGlow)" />
  <path d="M 60 180 C 20 120 50 50 90 20 C 80 80 110 120 150 160 Z" fill="#FACC15" stroke="#000000" stroke-width="4" />

  <!-- Right Spreading Surge -->
  <path d="M 282 360 C 382 380 472 320 492 220 C 502 160 462 120 432 80 C 432 150 372 190 322 230 Z" 
        fill="url(#flameErupt)" stroke="#000000" stroke-width="7" stroke-linejoin="round" filter="url(#eruptionGlow)" />
  <path d="M 452 180 C 492 120 462 50 422 20 C 432 80 402 120 362 160 Z" fill="#FACC15" stroke="#000000" stroke-width="4" />

  <!-- ==========================================
       2. TOWERING ERUPTION GEYSER (Vertical Column)
       ========================================== -->
  <!-- Massive Central Fire Pillar -->
  <path d="M 160 440 C 110 330 140 180 210 70 C 235 20 256 5 270 5 C 290 20 310 70 330 180 C 380 330 360 440 352 440 C 290 480 220 480 160 440 Z" 
        fill="url(#flameErupt)" stroke="#000000" stroke-width="9" stroke-linejoin="round" />

  <!-- Internal High-Intensity Flame Ribbons -->
  <path d="M 210 400 C 170 300 200 190 240 100 C 256 50 256 50 272 100 C 312 190 342 300 302 400 Z" 
        fill="#FDE047" stroke="#000000" stroke-width="6" stroke-linejoin="round" filter="url(#eruptionGlow)" />

  <!-- White-Hot Core Flame Spire -->
  <path d="M 235 340 C 220 250 240 170 256 90 C 272 170 292 250 277 340 Z" 
        fill="#FFFFFF" filter="url(#eruptionGlow)" />

  <!-- ==========================================
       3. STICKY MAGMA TENDRILS (Latching onto Tile Frame)
       ========================================== -->
  <!-- Top Frame Latch -->
  <path d="M 200 20 Q 256 60 312 20 Q 275 80 235 80 Z" fill="url(#stickyMagma)" stroke="#000000" stroke-width="4" filter="url(#eruptionGlow)" />
  
  <!-- Left Frame Latch & Drips -->
  <path d="M 20 200 Q 70 230 80 290 Q 40 270 20 280 Z" fill="url(#stickyMagma)" stroke="#000000" stroke-width="4" filter="url(#eruptionGlow)" />
  <circle cx="24" cy="320" r="6" fill="#F97316" filter="url(#eruptionGlow)" />

  <!-- Right Frame Latch & Drips -->
  <path d="M 492 200 Q 442 230 432 290 Q 472 270 492 280 Z" fill="url(#stickyMagma)" stroke="#000000" stroke-width="4" filter="url(#eruptionGlow)" />
  <circle cx="488" cy="320" r="6" fill="#F97316" filter="url(#eruptionGlow)" />

  <!-- Bottom Ruptured Basalt Floor -->
  <polygon points="120,440 180,420 220,460 140,490" fill="#180303" stroke="#000000" stroke-width="5" stroke-linejoin="round" />
  <polygon points="392,440 332,420 292,460 372,490" fill="#180303" stroke="#000000" stroke-width="5" stroke-linejoin="round" />

  <!-- ==========================================
       4. INCANDESCENT "W" (Forged in the Eruption)
       ========================================== -->
  <!-- Heavy Comic Black Shadow Drop for Instant Readability -->
  <path d="M 160 180 L 205 350 L 256 245 L 307 350 L 352 180 L 312 180 L 285 295 L 256 215 L 227 295 L 200 180 Z" 
        fill="#000000" stroke="#000000" stroke-width="14" stroke-linejoin="miter" />

  <!-- White-Hot Molten "W" Core -->
  <path d="M 160 180 L 205 350 L 256 245 L 307 350 L 352 180 L 312 180 L 285 295 L 256 215 L 227 295 L 200 180 Z" 
        fill="#FFFFFF" stroke="#FEF08A" stroke-width="3.5" stroke-linejoin="miter" filter="url(#eruptionGlow)" />

  <!-- Internal Magma Veins Inside "W" -->
  <polyline points="205,340 256,250 307,340" fill="none" stroke="#EA580C" stroke-width="3" stroke-linecap="round" />
  <polyline points="175,190 198,300" fill="none" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" />
  <polyline points="337,190 314,300" fill="none" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" />

  <!-- ==========================================
       5. COMIC INK HATCHING & FLYING MAGMA EMBERS
       ========================================== -->
  <g stroke="#000000" stroke-width="4" stroke-linecap="round">
    <!-- Flame Rib Creases -->
    <line x1="160" y1="280" x2="175" y2="310" />
    <line x1="352" y1="280" x2="337" y2="310" />
    <line x1="120" y1="360" x2="145" y2="380" />
    <line x1="392" y1="360" x2="367" y2="380" />
    <line x1="240" y1="440" x2="240" y2="465" />
    <line x1="272" y1="440" x2="272" y2="465" />
  </g>

  <!-- High-Velocity Magma Droplets & Sparks -->
  <circle cx="110" cy="90" r="5" fill="#FEF08A" filter="url(#eruptionGlow)" />
  <circle cx="400" cy="90" r="5" fill="#FEF08A" filter="url(#eruptionGlow)" />
  <circle cx="210" cy="30" r="4.5" fill="#FFFFFF" filter="url(#eruptionGlow)" />
  <circle cx="300" cy="30" r="4.5" fill="#FFFFFF" filter="url(#eruptionGlow)" />
  <circle cx="50" cy="140" r="4" fill="#F97316" filter="url(#eruptionGlow)" />
  <circle cx="460" cy="140" r="4" fill="#F97316" filter="url(#eruptionGlow)" />
  <circle cx="140" cy="470" r="3.5" fill="#EF4444" />
  <circle cx="370" cy="470" r="3.5" fill="#EF4444" />
  <circle cx="256" cy="495" r="5" fill="#FDE047" filter="url(#eruptionGlow)" />
</svg>

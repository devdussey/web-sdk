<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="fireSigilGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="l1Bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#240707" />
      <stop offset="60%" stop-color="#0F0303" />
      <stop offset="100%" stop-color="#020000" />
    </radialGradient>
    <linearGradient id="l1Stone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D2622" />
      <stop offset="50%" stop-color="#241411" />
      <stop offset="100%" stop-color="#0D0605" />
    </linearGradient>
    <linearGradient id="l1Flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="40%" stop-color="#EA580C" />
      <stop offset="80%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#l1Bg)" rx="32" />
  <rect x="24" y="24" width="464" height="464" rx="20" fill="none" stroke="#450A0A" stroke-width="3.5" stroke-dasharray="10, 6" />

  <!-- CHISELED BASALT TABLET -->
  <polygon points="256,60 430,130 430,382 256,452 82,382 82,130" 
           fill="url(#l1Stone)" stroke="#000000" stroke-width="9" stroke-linejoin="round" />
  
  <!-- Recessed Carving Bezel -->
  <polygon points="256,85 405,145 405,367 256,427 107,367 107,145" 
           fill="#0A0404" stroke="#1A0A0A" stroke-width="4" stroke-linejoin="round" />

  <!-- ENGRAVED FLAME SIGIL (Dual Sweeping Blades) -->
  <!-- Left Flame Blade -->
  <path d="M 230 130 C 180 180 150 250 170 330 C 180 370 210 395 240 405 C 220 370 210 320 220 280 C 230 240 250 190 230 130 Z" 
        fill="url(#l1Flame)" stroke="#000000" stroke-width="6" stroke-linejoin="round" filter="url(#fireSigilGlow)" />
  
  <!-- Right Flame Blade -->
  <path d="M 275 190 C 315 230 335 280 320 340 C 310 375 285 395 265 400 C 280 370 290 335 280 300 C 270 260 255 230 275 190 Z" 
        fill="url(#l1Flame)" stroke="#000000" stroke-width="5" stroke-linejoin="round" filter="url(#fireSigilGlow)" />

  <!-- Core Incandescent Ridge -->
  <path d="M 220 270 Q 235 340 215 375" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" filter="url(#fireSigilGlow)" />

  <!-- Chisel Hatching Marks -->
  <g stroke="#000000" stroke-width="3.5" stroke-linecap="round">
    <line x1="120" y1="170" x2="135" y2="190" />
    <line x1="390" y1="170" x2="375" y2="190" />
    <line x1="120" y1="340" x2="135" y2="320" />
    <line x1="390" y1="340" x2="375" y2="320" />
  </g>

  <!-- Floating Embers -->
  <circle cx="150" cy="120" r="3" fill="#FACC15" filter="url(#fireSigilGlow)" />
  <circle cx="360" cy="120" r="3" fill="#FACC15" filter="url(#fireSigilGlow)" />
  <circle cx="256" cy="465" r="4" fill="#F97316" filter="url(#fireSigilGlow)" />
</svg>

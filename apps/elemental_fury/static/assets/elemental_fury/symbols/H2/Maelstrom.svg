<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Teal/Mint Gale Bloom Filter -->
    <filter id="tealGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Deep Abyssal Teal Atmospheric Backdrop -->
    <radialGradient id="tealAtmosphere" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0F2E2E" />
      <stop offset="60%" stop-color="#081A1B" />
      <stop offset="100%" stop-color="#040B0C" />
    </radialGradient>

    <!-- Swirling Vortex Core Gradient -->
    <linearGradient id="vortexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="40%" stop-color="#0D9488" />
      <stop offset="80%" stop-color="#115E59" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>

    <!-- Shroud Shadow Gradient -->
    <linearGradient id="shroudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D14" />
    </linearGradient>
  </defs>

  <!-- Dark Tile Canvas -->
  <rect width="512" height="512" fill="url(#tealAtmosphere)" rx="32" />

  <!-- BACKGROUND FLOATING WIND RUNES -->
  <g fill="none" stroke="#0D9488" stroke-width="2.5" opacity="0.5" stroke-linecap="round">
    <!-- Top Left Wind Sigils -->
    <path d="M 50 60 Q 80 40 100 70 Q 110 90 90 105 Q 60 110 70 80" />
    <path d="M 40 130 C 70 120 90 150 60 165 M 80 140 L 95 180" />
    <!-- Top Right Swirls -->
    <path d="M 460 60 Q 430 40 410 70 Q 400 90 420 105 Q 450 110 440 80" />
    <path d="M 470 130 C 440 120 420 150 450 165 M 430 140 L 415 180" />
    <!-- Flank Gale Lines -->
    <path d="M 30 250 Q 80 230 120 260 M 35 280 Q 70 270 95 300" />
    <path d="M 480 250 Q 430 230 390 260 M 475 280 Q 440 270 415 300" />
  </g>

  <!-- LOWER BODY: THE HOWLING TORNADO VORTEX -->
  <!-- Outer Cyclone Funnel Spire -->
  <path d="M 170 280 C 120 340 160 410 230 480 L 256 500 L 282 480 C 352 410 392 340 342 280 Z" 
        fill="url(#vortexGrad)" stroke="#000000" stroke-width="8" stroke-linejoin="round" />

  <!-- Swirling Cyclone Wind Bands (Spinning Helix Layers) -->
  <g fill="none" stroke="#5EEAD4" stroke-linecap="round" filter="url(#tealGlow)">
    <!-- High Spin Band -->
    <path d="M 150 290 Q 256 340 362 290" stroke-width="6" />
    <!-- Mid Spin Band -->
    <path d="M 180 340 Q 256 390 332 340" stroke-width="5" />
    <!-- Low Funnel Band -->
    <path d="M 210 395 Q 256 435 302 395" stroke-width="4.5" />
    <!-- Spire Tip Spiral -->
    <path d="M 235 445 Q 256 470 277 445" stroke-width="4" />
  </g>

  <!-- Razor Air Slashes Spiraling Outward -->
  <path d="M 130 310 Q 90 350 110 390 Q 150 370 180 340" fill="none" stroke="#2DD4BF" stroke-width="4" filter="url(#tealGlow)" />
  <path d="M 382 310 Q 422 350 402 390 Q 362 370 332 340" fill="none" stroke="#2DD4BF" stroke-width="4" filter="url(#tealGlow)" />

  <!-- UPPER BODY: TATTERED WRAITH HOOD & SHROUDS -->
  <!-- Back Shroud Wings (Hovering Fabric) -->
  <path d="M 190 180 L 90 140 L 70 220 L 140 250 Z" fill="url(#shroudGrad)" stroke="#000000" stroke-width="7" stroke-linejoin="round" />
  <path d="M 322 180 L 422 140 L 442 220 L 372 250 Z" fill="url(#shroudGrad)" stroke="#000000" stroke-width="7" stroke-linejoin="round" />

  <!-- Floating Wispy Shoulders & Collar -->
  <path d="M 140 220 Q 256 160 372 220 L 340 300 Q 256 260 172 300 Z" fill="url(#shroudGrad)" stroke="#000000" stroke-width="8" stroke-linejoin="round" />

  <!-- Torn Floating Shroud Ribbons -->
  <path d="M 140 280 Q 110 340 130 400 Q 150 350 160 300 Z" fill="#134E4A" stroke="#000000" stroke-width="5" />
  <path d="M 372 280 Q 402 340 382 400 Q 362 350 352 300 Z" fill="#134E4A" stroke="#000000" stroke-width="5" />

  <!-- THE HOLLOW VISAGE (Cracked Porcelain Gale Mask) -->
  <!-- Mask Outer Shell -->
  <path d="M 210 110 C 180 150 190 220 220 250 C 240 265 272 265 292 250 C 322 220 332 150 302 110 C 275 80 235 80 210 110 Z" 
        fill="#E2E8F0" stroke="#000000" stroke-width="7" stroke-linejoin="round" />

  <!-- Mask Dark Comic Shading -->
  <path d="M 210 110 C 195 140 200 190 215 220 L 256 260 L 220 250 C 190 220 180 150 210 110 Z" fill="#94A3B8" opacity="0.4" />

  <!-- Mask Fracture Cracks Leaking Wind -->
  <path d="M 256 95 L 250 140 L 270 170 L 256 210" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" />
  <path d="M 270 170 L 295 180" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" />
  <path d="M 250 140 L 225 150" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" />

  <!-- Piercing Ghostly Cyan Eye Slits -->
  <polygon points="220,165 245,170 230,185" fill="#5EEAD4" filter="url(#tealGlow)" stroke="#000000" stroke-width="2" />
  <polygon points="292,165 267,170 282,185" fill="#5EEAD4" filter="url(#tealGlow)" stroke="#000000" stroke-width="2" />

  <!-- ELONGATED VAPOR TALONS & GALE CONJURING -->
  <!-- Left Vapor Arm & Claws -->
  <path d="M 130 250 Q 80 280 60 350 Q 90 340 120 310 Z" fill="#0D9488" stroke="#000000" stroke-width="6" />
  <!-- Left Sharp Claws -->
  <path d="M 60 350 L 30 380 M 55 360 L 20 400 M 70 365 L 45 420" stroke="#5EEAD4" stroke-width="4.5" stroke-linecap="round" filter="url(#tealGlow)" />

  <!-- Right Vapor Arm & Claws -->
  <path d="M 382 250 Q 432 280 452 350 Q 422 340 392 310 Z" fill="#0D9488" stroke="#000000" stroke-width="6" />
  <!-- Right Sharp Claws -->
  <path d="M 452 350 L 482 380 M 457 360 L 492 400 M 442 365 L 467 420" stroke="#5EEAD4" stroke-width="4.5" stroke-linecap="round" filter="url(#tealGlow)" />

  <!-- COMIC INK HATCHING & AIR CUT MARKS -->
  <g stroke="#000000" stroke-width="3.5" stroke-linecap="round">
    <line x1="220" y1="360" x2="250" y2="350" />
    <line x1="270" y1="360" x2="300" y2="350" />
    <line x1="230" y1="410" x2="260" y2="400" />
    <line x1="260" y1="460" x2="275" y2="450" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Intense Fire & Runic Glow Filter -->
    <filter id="flameGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Deep Red Arcane Background Gradient -->
    <radialGradient id="bgHaze" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4A100B" />
      <stop offset="60%" stop-color="#240707" />
      <stop offset="100%" stop-color="#0E0303" />
    </radialGradient>

    <!-- Body Armor Linear Gradient -->
    <linearGradient id="demonArmor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D302E" />
      <stop offset="50%" stop-color="#2A201F" />
      <stop offset="100%" stop-color="#140E0E" />
    </linearGradient>

    <!-- Horn Segment Gradient -->
    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B2222" />
      <stop offset="50%" stop-color="#191313" />
      <stop offset="100%" stop-color="#080606" />
    </linearGradient>

    <!-- Blazing Fire Crest Gradient -->
    <linearGradient id="fireCrest" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="30%" stop-color="#EA580C" />
      <stop offset="70%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FFFBEB" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="512" height="512" fill="url(#bgHaze)" rx="32" />

  <!-- BACKGROUND ARCANE RUNIC GLYPHS -->
  <g fill="none" stroke="#991B1B" stroke-width="2.5" opacity="0.6" stroke-linecap="round">
    <!-- Top Left Runes -->
    <path d="M 50 60 L 50 110 M 40 80 L 70 80 M 65 60 L 75 100" />
    <path d="M 60 130 C 80 120 90 150 70 160 C 50 170 100 170 100 170" />
    <!-- Top Right Runes -->
    <path d="M 430 60 L 450 60 L 450 110 M 435 90 L 465 90" />
    <path d="M 440 130 C 420 120 410 150 430 160 M 450 140 L 450 170" />
    <!-- Mid Flank Runes -->
    <path d="M 45 220 L 75 240 L 45 260 M 60 220 L 60 270" />
    <path d="M 445 230 L 475 230 M 460 215 L 460 280 M 440 270 L 470 260" />
  </g>

  <!-- BACKSTAGE FIRE AURA & FLAME CROWN -->
  <path d="M 170 200 C 130 90 200 40 256 10 C 310 40 380 90 342 200 C 390 140 370 70 340 40 C 300 120 310 180 300 220 C 270 130 256 80 256 30 C 240 100 230 140 210 220 Z" 
        fill="url(#fireCrest)" filter="url(#flameGlow)" />

  <!-- MASSIVE CURVED DEMON HORNS -->
  <!-- Left Horn -->
  <path d="M 210 200 C 160 150 100 140 70 200 C 50 250 80 290 120 300 C 110 270 110 240 130 220 C 155 200 185 210 210 220 Z" 
        fill="url(#hornGrad)" stroke="#000000" stroke-width="6" stroke-linejoin="round" />
  <!-- Left Horn Ridges -->
  <path d="M 100 180 Q 120 205 130 220 M 75 225 Q 95 245 115 255 M 85 270 Q 105 280 120 300" stroke="#000000" stroke-width="4" fill="none" />

  <!-- Right Horn -->
  <path d="M 302 200 C 352 150 412 140 442 200 C 462 250 432 290 392 300 C 402 270 402 240 382 220 C 357 200 327 210 302 220 Z" 
        fill="url(#hornGrad)" stroke="#000000" stroke-width="6" stroke-linejoin="round" />
  <!-- Right Horn Ridges -->
  <path d="M 412 180 Q 392 205 382 220 M 437 225 Q 417 245 397 255 M 427 270 Q 407 280 392 300" stroke="#000000" stroke-width="4" fill="none" />

  <!-- MAIN BODY: TORSO & SHOULDERS -->
  <!-- Chest & Abs Core -->
  <path d="M 180 290 L 256 310 L 332 290 L 320 440 L 256 460 L 192 440 Z" fill="url(#demonArmor)" stroke="#000000" stroke-width="7" stroke-linejoin="round" />

  <!-- Jagged Pauldrons (Spiked Shoulder Guards) -->
  <path d="M 180 280 L 110 240 L 90 280 L 150 340 L 190 310 Z" fill="url(#demonArmor)" stroke="#000000" stroke-width="7" stroke-linejoin="round" />
  <path d="M 332 280 L 402 240 L 422 280 L 362 340 L 322 310 Z" fill="url(#demonArmor)" stroke="#000000" stroke-width="7" stroke-linejoin="round" />

  <!-- Biceps & Forearms with Wraps -->
  <path d="M 130 330 L 90 410 L 130 450 L 160 360 Z" fill="url(#demonArmor)" stroke="#000000" stroke-width="6" />
  <path d="M 382 330 L 422 410 L 382 450 L 352 360 Z" fill="url(#demonArmor)" stroke="#000000" stroke-width="6" />

  <!-- GLOWING RUNIC CRACKS & VEINS (Magma Core) -->
  <g fill="none" stroke="#FBBF24" stroke-width="4" stroke-linecap="round" filter="url(#flameGlow)">
    <!-- Chest Fracture Lines -->
    <path d="M 256 320 L 256 380 M 256 340 L 220 330 M 256 340 L 292 330" />
    <path d="M 230 370 L 256 385 L 282 370" />
    <path d="M 240 405 L 256 415 L 272 405" />
    <!-- Shoulder & Collar Sigils -->
    <path d="M 140 270 C 130 290 150 300 160 285" />
    <path d="M 372 270 C 382 290 362 300 352 285" />
    <!-- Arm Runic Bands -->
    <path d="M 105 380 L 135 390 M 100 415 L 125 425" />
    <path d="M 407 380 L 377 390 M 412 415 L 387 425" />
  </g>

  <!-- HEAD & FACE VISAGE -->
  <!-- Dark Armored Face Shape -->
  <path d="M 215 210 L 256 190 L 297 210 L 285 275 L 256 300 L 227 275 Z" fill="#1C1414" stroke="#000000" stroke-width="6" stroke-linejoin="round" />

  <!-- Blazing Eyes (Piercing Slits) -->
  <polygon points="228,240 248,242 238,252" fill="#FFFBEB" filter="url(#flameGlow)" stroke="#000000" stroke-width="1.5" />
  <polygon points="284,240 264,242 274,252" fill="#FFFBEB" filter="url(#flameGlow)" stroke="#000000" stroke-width="1.5" />

  <!-- Collar / Neck Plate -->
  <path d="M 225 295 L 256 315 L 287 295 L 256 325 Z" fill="#140E0E" stroke="#000000" stroke-width="4" />

  <!-- FOREGROUND HANDS (Flame Conjuring Claws) -->
  <!-- Left Hand Claws & Fire -->
  <path d="M 110 440 L 70 470 C 95 480 120 460 140 450 Z" fill="#191313" stroke="#000000" stroke-width="5" />
  <path d="M 70 470 C 60 430 100 420 90 390 C 110 410 120 440 100 470 Z" fill="#FBBF24" filter="url(#flameGlow)" />

  <!-- Right Hand Claws & Fire -->
  <path d="M 402 440 L 442 470 C 417 480 392 460 372 450 Z" fill="#191313" stroke="#000000" stroke-width="5" />
  <path d="M 442 470 C 452 430 412 420 422 390 C 402 410 392 440 412 470 Z" fill="#FBBF24" filter="url(#flameGlow)" />

  <!-- HEAVY COMIC HATCHING INK LINES -->
  <g stroke="#000000" stroke-width="3" stroke-linecap="round">
    <line x1="200" y1="350" x2="200" y2="370" />
    <line x1="312" y1="350" x2="312" y2="370" />
    <line x1="210" y1="410" x2="215" y2="430" />
    <line x1="302" y1="410" x2="297" y2="430" />
  </g>
</svg>

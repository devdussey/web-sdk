<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Glacial Bloom & Refraction Glow -->
    <filter id="iceGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Deep Abyssal Glacier Void Backdrop -->
    <radialGradient id="glacierVoid" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#082F49" />
      <stop offset="55%" stop-color="#041826" />
      <stop offset="100%" stop-color="#010B12" />
    </radialGradient>

    <!-- Shadowed Ice Facet Gradient -->
    <linearGradient id="iceShadowFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#082F49" />
    </linearGradient>

    <!-- Midtone Translucent Ice Gradient -->
    <linearGradient id="iceMidFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Refractive Bright Crystal Ice Gradient -->
    <linearGradient id="iceBrightFacet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Freezing Mist Drift -->
    <radialGradient id="iceMist" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark Tile Canvas -->
  <rect width="512" height="512" fill="url(#glacierVoid)" rx="32" />

  <!-- BACKGROUND ARCANE FROST RUNES & FLOATING CRYSTALS -->
  <g fill="none" stroke="#0284C7" stroke-width="2.5" opacity="0.6" stroke-linecap="round">
    <!-- Top Left Glyphs -->
    <path d="M 45 60 L 45 120 M 30 75 L 60 105 M 30 105 L 60 75" />
    <path d="M 75 50 L 95 80 L 75 110" />
    <!-- Top Right Glyphs -->
    <path d="M 467 60 L 467 120 M 452 75 L 482 105 M 452 105 L 482 75" />
    <path d="M 437 50 L 417 80 L 437 110" />
    <!-- Floating Hexagonal Ice Shards -->
    <polygon points="50,220 62,205 74,220 74,238 62,250 50,238" fill="#0369A1" stroke="#000000" stroke-width="2" />
    <polygon points="450,220 462,205 474,220 474,238 462,250 450,238" fill="#0369A1" stroke="#000000" stroke-width="2" />
  </g>

  <!-- BACKGROUND GLACIAL SPIRES (Back Crown & Shoulders) -->
  <!-- Center Main Glacier Horn -->
  <polygon points="256,15 230,120 282,120" fill="url(#iceBrightFacet)" stroke="#000000" stroke-width="7" stroke-linejoin="round" />
  <polygon points="256,15 256,120 282,120" fill="#0284C7" opacity="0.4" />

  <!-- Left Flank Spires -->
  <polygon points="195,110 130,40 100,80 150,170" fill="url(#iceShadowFacet)" stroke="#000000" stroke-width="7" stroke-linejoin="round" />
  <polygon points="130,40 145,115 100,80" fill="url(#iceBrightFacet)" />
  <polygon points="120,180 50,150 70,230 130,220" fill="url(#iceMidFacet)" stroke="#000000" stroke-width="7" stroke-linejoin="round" />

  <!-- Right Flank Spires -->
  <polygon points="317,110 382,40 412,80 362,170" fill="url(#iceShadowFacet)" stroke="#000000" stroke-width="7" stroke-linejoin="round" />
  <polygon points="382,40 367,115 412,80" fill="url(#iceBrightFacet)" />
  <polygon points="392,180 462,150 442,230 382,220" fill="url(#iceMidFacet)" stroke="#000000" stroke-width="7" stroke-linejoin="round" />

  <!-- CRYSTALLINE ICE TORSO & SHOULDER CLUSTERS -->
  <!-- Left Shoulder Crystal Cluster -->
  <polygon points="150,260 40,240 60,360 160,370" fill="url(#iceShadowFacet)" stroke="#000000" stroke-width="8" stroke-linejoin="round" />
  <polygon points="40,240 110,290 60,360" fill="url(#iceBrightFacet)" />
  <polygon points="110,290 160,370 140,260" fill="url(#iceMidFacet)" />

  <!-- Right Shoulder Crystal Cluster -->
  <polygon points="362,260 472,240 452,360 352,370" fill="url(#iceShadowFacet)" stroke="#000000" stroke-width="8" stroke-linejoin="round" />
  <polygon points="472,240 402,290 452,360" fill="url(#iceBrightFacet)" />
  <polygon points="402,290 352,370 372,260" fill="url(#iceMidFacet)" />

  <!-- Torso Crystalline Facets (Pure Ice Form) -->
  <polygon points="160,340 256,360 210,480 150,440" fill="url(#iceShadowFacet)" stroke="#000000" stroke-width="8" stroke-linejoin="round" />
  <polygon points="352,340 256,360 302,480 362,440" fill="url(#iceShadowFacet)" stroke="#000000" stroke-width="8" stroke-linejoin="round" />
  <polygon points="256,360 210,480 256,505 302,480" fill="url(#iceMidFacet)" stroke="#000000" stroke-width="8" stroke-linejoin="round" />
  <polygon points="256,360 256,505 302,480" fill="url(#iceBrightFacet)" opacity="0.6" />

  <!-- THE PURE ICE VISAGE (Chiseled Diamond Skull Anatomy) -->
  <!-- Cranium Top Facets -->
  <polygon points="180,140 256,110 256,190 170,190" fill="url(#iceMidFacet)" stroke="#000000" stroke-width="7" stroke-linejoin="round" />
  <polygon points="332,140 256,110 256,190 342,190" fill="url(#iceBrightFacet)" stroke="#000000" stroke-width="7" stroke-linejoin="round" />
  
  <!-- Temple & Brow Facets -->
  <polygon points="170,190 256,190 225,230 155,230" fill="url(#iceShadowFacet)" stroke="#000000" stroke-width="7" stroke-linejoin="round" />
  <polygon points="342,190 256,190 287,230 357,230" fill="url(#iceMidFacet)" stroke="#000000" stroke-width="7" stroke-linejoin="round" />

  <!-- Cheek & Nose Crystal Ridge -->
  <polygon points="225,230 256,190 287,230 256,300" fill="url(#iceBrightFacet)" stroke="#000000" stroke-width="7" stroke-linejoin="round" />
  <polygon points="155,230 225,230 256,300 170,320" fill="url(#iceShadowFacet)" stroke="#000000" stroke-width="7" stroke-linejoin="round" />
  <polygon points="357,230 287,230 256,300 342,320" fill="url(#iceMidFacet)" stroke="#000000" stroke-width="7" stroke-linejoin="round" />

  <!-- PIERCING GLACIAL SLIT EYES -->
  <!-- Left Eye -->
  <polygon points="175,225 230,225 215,245 165,240" fill="#FFFFFF" filter="url(#iceGlow)" stroke="#000000" stroke-width="4" />
  <line x1="160" y1="220" x2="235" y2="220" stroke="#000000" stroke-width="7" stroke-linecap="round" />

  <!-- Right Eye -->
  <polygon points="337,225 282,225 297,245 347,240" fill="#FFFFFF" filter="url(#iceGlow)" stroke="#000000" stroke-width="4" />
  <line x1="352" y1="220" x2="277" y2="220" stroke="#000000" stroke-width="7" stroke-linecap="round" />

  <!-- JAW CREVASSE & RAZOR ICICLE FANGS -->
  <!-- Hollow Crystal Maw Void -->
  <polygon points="200,310 256,325 312,310 290,360 222,360" fill="#01131E" stroke="#000000" stroke-width="7" stroke-linejoin="round" />

  <!-- Upper Icicle Fangs -->
  <polygon points="208,310 216,335 224,310" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <polygon points="230,315 240,345 250,315" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <polygon points="262,315 272,345 282,315" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <polygon points="288,310 296,335 304,310" fill="#FFFFFF" stroke="#000000" stroke-width="2" />

  <!-- Lower Icicle Fangs -->
  <polygon points="225,360 233,338 241,360" fill="#BAE6FD" stroke="#000000" stroke-width="2" />
  <polygon points="248,360 256,332 264,360" fill="#BAE6FD" stroke="#000000" stroke-width="2" />
  <polygon points="271,360 279,338 287,360" fill="#BAE6FD" stroke="#000000" stroke-width="2" />

  <!-- Lower Jaw Chiseled Crystals -->
  <polygon points="170,320 256,365 222,420 160,370" fill="url(#iceShadowFacet)" stroke="#000000" stroke-width="7" stroke-linejoin="round" />
  <polygon points="342,320 256,365 290,420 352,370" fill="url(#iceMidFacet)" stroke="#000000" stroke-width="7" stroke-linejoin="round" />
  <polygon points="222,420 256,365 290,420 256,450" fill="url(#iceBrightFacet)" stroke="#000000" stroke-width="7" stroke-linejoin="round" />

  <!-- FREEZING VAPOR DRIFTS -->
  <ellipse cx="210" cy="270" rx="35" ry="18" fill="url(#iceMist)" />
  <ellipse cx="302" cy="270" rx="35" ry="18" fill="url(#iceMist)" />
  <ellipse cx="256" cy="380" rx="70" ry="25" fill="url(#iceMist)" />

  <!-- INTERNAL CRYSTAL FRACTURES & REFRACTIONS (Neon Cyan Light) -->
  <g fill="none" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#iceGlow)">
    <polyline points="256,110 256,190 225,230 256,300 256,365 256,450" stroke-width="4" />
    <polyline points="180,140 225,190 200,230" />
    <polyline points="332,140 287,190 312,230" />
    <polyline points="150,260 210,340 180,390" />
    <polyline points="362,260 302,340 332,390" />
  </g>

  <!-- COMIC INK CHISEL HATCHING -->
  <g stroke="#000000" stroke-width="3" stroke-linecap="round">
    <line x1="170" y1="260" x2="185" y2="280" />
    <line x1="160" y1="280" x2="175" y2="300" />
    <line x1="342" y1="260" x2="327" y2="280" />
    <line x1="352" y1="280" x2="337" y2="300" />
    <line x1="230" y1="450" x2="245" y2="470" />
    <line x1="282" y1="450" x2="267" y2="470" />
  </g>

  <!-- FLOATING ICE PARTICLES & DIAMOND SPARKLES -->
  <circle cx="110" cy="110" r="3.5" fill="#FFFFFF" filter="url(#iceGlow)" />
  <circle cx="400" cy="110" r="3.5" fill="#FFFFFF" filter="url(#iceGlow)" />
  <circle cx="70" cy="290" r="3" fill="#38BDF8" filter="url(#iceGlow)" />
  <circle cx="442" cy="290" r="3" fill="#38BDF8" filter="url(#iceGlow)" />
  <circle cx="256" cy="485" r="4" fill="#FFFFFF" filter="url(#iceGlow)" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" width="100%" height="100%">
  <defs>
    <!-- Master Drop Shadow Filter -->
    <filter id="chassisShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <!-- Elemental Glow Highlights -->
    <filter id="elementalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Meteoric Iron Outer Bezel Gradient -->
    <linearGradient id="ironBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="35%" stop-color="#1E293B" />
      <stop offset="70%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Inner Board Glass Backing (Dark semi-transparent for symbol contrast) -->
    <radialGradient id="boardBacking" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0.88" />
      <stop offset="70%" stop-color="#07090D" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#020305" stop-opacity="0.98" />
    </radialGradient>

    <!-- Corner Gradients for the 4 Harbingers -->
    <!-- Top-Left: Subzero Ice -->
    <linearGradient id="cornerIce" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Top-Right: Wildfire Magma -->
    <linearGradient id="cornerFire" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>

    <!-- Bottom-Left: Supercell Storm -->
    <linearGradient id="cornerStorm" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>

    <!-- Bottom-Right: Maelstrom Wind -->
    <linearGradient id="cornerWind" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#5EEAD4" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Single Cell Bracket Pattern Definition -->
    <g id="cellFrame">
      <rect width="160" height="160" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="8, 6" opacity="0.4" />
      <!-- Subtle 4-Corner Crosses -->
      <path d="M 0 10 L 0 0 L 10 0 M 150 0 L 160 0 L 160 10 M 160 150 L 160 160 L 150 160 M 10 160 L 0 160 L 0 150" 
            fill="none" stroke="#334155" stroke-width="2" opacity="0.6" />
    </g>
  </defs>

  <!-- ==========================================
       1. OUTER CHASSIS (Heavy Weathered Iron Bounding Box)
       ========================================== -->
  <!-- Outer Shadow Casting Hull -->
  <rect x="70" y="60" width="1060" height="900" rx="28" fill="#000000" filter="url(#chassisShadow)" />

  <!-- Main Bezel Frame Construction -->
  <rect x="70" y="60" width="1060" height="900" rx="28" fill="url(#ironBezel)" stroke="#000000" stroke-width="10" />

  <!-- Inner Recessed Board Backing ($960 \times 800$ exact play area) -->
  <rect x="120" y="110" width="960" height="800" rx="14" fill="url(#boardBacking)" stroke="#000000" stroke-width="8" />

  <!-- ==========================================
       2. REEL GRID CELLS (6 Columns × 5 Rows = 30 Cells)
       Each Cell is exactly 160px × 160px
       ========================================== -->
  <g transform="translate(120, 110)">
    <!-- ROW 1 -->
    <use href="#cellFrame" x="0" y="0" />
    <use href="#cellFrame" x="160" y="0" />
    <use href="#cellFrame" x="320" y="0" />
    <use href="#cellFrame" x="480" y="0" />
    <use href="#cellFrame" x="640" y="0" />
    <use href="#cellFrame" x="800" y="0" />

    <!-- ROW 2 -->
    <use href="#cellFrame" x="0" y="160" />
    <use href="#cellFrame" x="160" y="160" />
    <use href="#cellFrame" x="320" y="160" />
    <use href="#cellFrame" x="480" y="160" />
    <use href="#cellFrame" x="640" y="160" />
    <use href="#cellFrame" x="800" y="160" />

    <!-- ROW 3 -->
    <use href="#cellFrame" x="0" y="320" />
    <use href="#cellFrame" x="160" y="320" />
    <use href="#cellFrame" x="320" y="320" />
    <use href="#cellFrame" x="480" y="320" />
    <use href="#cellFrame" x="640" y="320" />
    <use href="#cellFrame" x="800" y="320" />

    <!-- ROW 4 -->
    <use href="#cellFrame" x="0" y="480" />
    <use href="#cellFrame" x="160" y="480" />
    <use href="#cellFrame" x="320" y="480" />
    <use href="#cellFrame" x="480" y="480" />
    <use href="#cellFrame" x="640" y="480" />
    <use href="#cellFrame" x="800" y="480" />

    <!-- ROW 5 -->
    <use href="#cellFrame" x="0" y="640" />
    <use href="#cellFrame" x="160" y="640" />
    <use href="#cellFrame" x="320" y="640" />
    <use href="#cellFrame" x="480" y="640" />
    <use href="#cellFrame" x="640" y="640" />
    <use href="#cellFrame" x="800" y="640" />

    <!-- REEL COLUMN DIVIDER RAILS (Heavy Vertical Inked Bars) -->
    <g stroke="#000000" stroke-width="6" opacity="0.8">
      <line x1="160" y1="0" x2="160" y2="800" />
      <line x1="320" y1="0" x2="320" y2="800" />
      <line x1="480" y1="0" x2="480" y2="800" />
      <line x1="640" y1="0" x2="640" y2="800" />
      <line x1="800" y1="0" x2="800" y2="800" />
    </g>
    <!-- Faint Highlighting on Rails -->
    <g stroke="#334155" stroke-width="1.5" opacity="0.6">
      <line x1="162" y1="0" x2="162" y2="800" />
      <line x1="322" y1="0" x2="322" y2="800" />
      <line x1="482" y1="0" x2="482" y2="800" />
      <line x1="642" y1="0" x2="642" y2="800" />
      <line x1="802" y1="0" x2="802" y2="800" />
    </g>
  </g>

  <!-- ==========================================
       3. THE 4 HARBINGER CORNER BRACKETS
       ========================================== -->
  <!-- TOP-LEFT: SUBZERO (Glacial Spire Clamps) -->
  <g filter="url(#elementalGlow)">
    <polygon points="50,40 180,40 150,110 110,110 110,150 40,180" fill="url(#cornerIce)" stroke="#000000" stroke-width="7" stroke-linejoin="round" />
    <polygon points="60,50 140,50 110,95 50,140" fill="#FFFFFF" opacity="0.6" />
    <!-- Glacial Fang Shards -->
    <polygon points="30,80 70,100 40,130" fill="#BAE6FD" stroke="#000000" stroke-width="3" />
    <polygon points="80,30 100,70 130,40" fill="#BAE6FD" stroke="#000000" stroke-width="3" />
  </g>

  <!-- TOP-RIGHT: WILDFIRE (Molten Magma Clamps & Horns) -->
  <g filter="url(#elementalGlow)">
    <polygon points="1150,40 1020,40 1050,110 1090,110 1090,150 1160,180" fill="url(#cornerFire)" stroke="#000000" stroke-width="7" stroke-linejoin="round" />
    <polygon points="1140,50 1060,50 1090,95 1150,140" fill="#FEF08A" opacity="0.6" />
    <!-- Molten Horn Tips -->
    <polygon points="1170,80 1130,100 1160,130" fill="#FF4500" stroke="#000000" stroke-width="3" />
    <polygon points="1120,30 1100,70 1070,40" fill="#FF4500" stroke="#000000" stroke-width="3" />
  </g>

  <!-- BOTTOM-LEFT: SUPERCELL (Conductor Lightning Rods & Voltage Plates) -->
  <g filter="url(#elementalGlow)">
    <polygon points="50,980 180,980 150,910 110,910 110,870 40,840" fill="url(#cornerStorm)" stroke="#000000" stroke-width="7" stroke-linejoin="round" />
    <polygon points="60,970 140,970 110,925 50,880" fill="#C084FC" opacity="0.6" />
    <!-- Conductor Spikes -->
    <polygon points="30,940 70,920 40,890" fill="#FFFFFF" stroke="#000000" stroke-width="3" />
    <polygon points="80,990 100,950 130,980" fill="#FFFFFF" stroke="#000000" stroke-width="3" />
  </g>

  <!-- BOTTOM-RIGHT: MAELSTROM (Aerodynamic Gale Wing Brackets) -->
  <g filter="url(#elementalGlow)">
    <polygon points="1150,980 1020,980 1050,910 1090,910 1090,870 1160,840" fill="url(#cornerWind)" stroke="#000000" stroke-width="7" stroke-linejoin="round" />
    <polygon points="1140,970 1060,970 1090,925 1150,880" fill="#5EEAD4" opacity="0.6" />
    <!-- Gale Blade Wings -->
    <polygon points="1170,940 1130,920 1160,890" fill="#0D9488" stroke="#000000" stroke-width="3" />
    <polygon points="1120,990 1100,950 1070,980" fill="#0D9488" stroke="#000000" stroke-width="3" />
  </g>

  <!-- ==========================================
       4. TOP CENTER HEADER FIXTURE ("ELEMENTAL FURY")
       ========================================== -->
  <!-- Header Armor Plaque Base -->
  <polygon points="420,30 780,30 820,90 760,110 440,110 380,90" fill="#0F172A" stroke="#000000" stroke-width="8" stroke-linejoin="round" />
  <polygon points="435,45 765,45 795,90 745,100 455,100 405,90" fill="#1E293B" stroke="#475569" stroke-width="2.5" />

  <!-- Chiseled Title Typographic Text -->
  <text x="600" y="76" font-family="'Impact', 'Arial Black', sans-serif" font-size="30" font-weight="900" 
        letter-spacing="5" fill="#FFFFFF" stroke="#000000" stroke-width="3" text-anchor="middle">ELEMENTAL FURY</text>
  <text x="600" y="76" font-family="'Impact', 'Arial Black', sans-serif" font-size="30" font-weight="900" 
        letter-spacing="5" fill="#F8FAFC" text-anchor="middle">ELEMENTAL FURY</text>

  <!-- ==========================================
       5. CHASSIS INDUSTRIAL RIVETS & COMIC HATCHES
       ========================================== -->
  <!-- Top & Bottom Rail Rivets -->
  <g fill="#94A3B8" stroke="#000000" stroke-width="2.5">
    <circle cx="280" cy="85" r="5" />
    <circle cx="360" cy="85" r="5" />
    <circle cx="840" cy="85" r="5" />
    <circle cx="920" cy="85" r="5" />
    <circle cx="280" cy="935" r="5" />
    <circle cx="440" cy="935" r="5" />
    <circle cx="600" cy="935" r="5" />
    <circle cx="760" cy="935" r="5" />
    <circle cx="920" cy="935" r="5" />
    <!-- Flank Vertical Rivets -->
    <circle cx="95" cy="300" r="5" />
    <circle cx="95" cy="510" r="5" />
    <circle cx="95" cy="720" r="5" />
    <circle cx="1105" cy="300" r="5" />
    <circle cx="1105" cy="510" r="5" />
    <circle cx="1105" cy="720" r="5" />
  </g>

  <!-- Comic Inking Chisel Strokes on Hull -->
  <g stroke="#000000" stroke-width="4" stroke-linecap="round">
    <line x1="200" y1="75" x2="225" y2="75" />
    <line x1="975" y1="75" x2="1000" y2="75" />
    <line x1="200" y1="945" x2="225" y2="945" />
    <line x1="975" y1="945" x2="1000" y2="945" />
  </g>
</svg>

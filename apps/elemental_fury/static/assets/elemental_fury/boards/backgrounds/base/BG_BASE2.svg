<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Multi-Stage Plasma Bloom Filters -->
    <filter id="plasmaBloomSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="plasmaBloomIntense" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Deep Space Vacuum Backdrop -->
    <radialGradient id="deepVoid" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0B0314" />
      <stop offset="45%" stop-color="#040108" />
      <stop offset="85%" stop-color="#010003" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Central Clash Chamber Nebula Aura -->
    <radialGradient id="sphereAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7E22CE" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#4C1D95" stop-opacity="0.25" />
      <stop offset="75%" stop-color="#1E0B36" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- 1. Wildfire Flame/Crimson Gradient (Top-Left & Left Beam) -->
    <linearGradient id="wildfireBolt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F1D1D" />
      <stop offset="25%" stop-color="#DC2626" />
      <stop offset="60%" stop-color="#EF4444" />
      <stop offset="85%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- 2. Supercell Purple/Violet Gradient (Bottom-Left & Lower Clash) -->
    <linearGradient id="supercellBolt" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B0764" />
      <stop offset="30%" stop-color="#7E22CE" />
      <stop offset="65%" stop-color="#A855F7" />
      <stop offset="85%" stop-color="#E879F9" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- 3. Subzero Glacial Cyan Gradient (Top-Right & Right Beam) -->
    <linearGradient id="subzeroBolt" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#082F49" />
      <stop offset="30%" stop-color="#0284C7" />
      <stop offset="65%" stop-color="#38BDF8" />
      <stop offset="85%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- 4. Maelstrom Toxic Teal Gradient (Bottom-Right & Lower Clash) -->
    <linearGradient id="maelstromBolt" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#042F2E" />
      <stop offset="30%" stop-color="#0D9488" />
      <stop offset="65%" stop-color="#2DD4BF" />
      <stop offset="85%" stop-color="#5EEAD4" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Left Red Horizontal Feed Core Gradient -->
    <linearGradient id="redBeamGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#991B1B" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#DC2626" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Right Blue Horizontal Feed Core Gradient -->
    <linearGradient id="blueBeamGrad" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#0369A1" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>

  <!-- Canvas Deep Space Backdrop -->
  <rect width="1920" height="1080" fill="url(#deepVoid)" />

  <!-- ========================================================
       1. AMBIENT NEBULA HAZE & HIGH-VOLTAGE CLOUD SHEET FLASHES
       ======================================================== -->
  <!-- Left Crimson/Purple Ambient Flare -->
  <ellipse cx="450" cy="540" rx="450" ry="320" fill="#DC2626" opacity="0.12" filter="url(#plasmaBloomIntense)" />
  <ellipse cx="400" cy="780" rx="360" ry="240" fill="#7E22CE" opacity="0.14" filter="url(#plasmaBloomIntense)" />

  <!-- Right Cyan/Blue Ambient Flare -->
  <ellipse cx="1470" cy="540" rx="450" ry="320" fill="#0284C7" opacity="0.14" filter="url(#plasmaBloomIntense)" />
  <ellipse cx="1520" cy="780" rx="360" ry="240" fill="#0D9488" opacity="0.1" filter="url(#plasmaBloomIntense)" />

  <!-- Central Clash Chamber Violet Glow -->
  <circle cx="960" cy="540" r="420" fill="url(#sphereAura)" filter="url(#plasmaBloomIntense)" />

  <!-- ========================================================
       2. THE 4 HARBINGER CORNER CHANNELS (Channeling Inward)
       ======================================================== -->
  
  <!-- CORNER 1: TOP-LEFT (WILDFIRE - Crimson Fire Lightning) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="miter" filter="url(#plasmaBloomSoft)">
    <!-- Major Inflow Bolts -->
    <polyline points="0,60 140,110 190,80 320,180 370,160 520,320 620,380 720,440" stroke="url(#wildfireBolt)" stroke-width="6" />
    <polyline points="0,60 140,110 190,80 320,180 370,160 520,320 620,380 720,440" stroke="#FFFFFF" stroke-width="2" />
    <!-- Secondary Branches -->
    <polyline points="190,80 260,40 330,70" stroke="#DC2626" stroke-width="3" />
    <polyline points="370,160 440,110 490,140 580,220" stroke="#EF4444" stroke-width="3.5" />
    <polyline points="520,320 590,270 660,300" stroke="#F87171" stroke-width="2.5" />
  </g>

  <!-- CORNER 2: BOTTOM-LEFT (SUPERCELL - Violet/Magenta Lightning) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="miter" filter="url(#plasmaBloomSoft)">
    <!-- Major Inflow Bolts -->
    <polyline points="0,1020 150,960 210,990 340,880 400,910 540,760 640,700 730,640" stroke="url(#supercellBolt)" stroke-width="6" />
    <polyline points="0,1020 150,960 210,990 340,880 400,910 540,760 640,700 730,640" stroke="#FFFFFF" stroke-width="2" />
    <!-- Secondary Branches -->
    <polyline points="210,990 290,1040 360,1000" stroke="#7E22CE" stroke-width="3" />
    <polyline points="400,910 460,970 530,940 600,840" stroke="#A855F7" stroke-width="3.5" />
    <polyline points="540,760 620,800 680,760" stroke="#E879F9" stroke-width="2.5" />
  </g>

  <!-- CORNER 3: TOP-RIGHT (SUBZERO - Glacial Ice Cyan Lightning) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="miter" filter="url(#plasmaBloomSoft)">
    <!-- Major Inflow Bolts -->
    <polyline points="1920,60 1780,110 1730,80 1600,180 1550,160 1400,320 1300,380 1200,440" stroke="url(#subzeroBolt)" stroke-width="6" />
    <polyline points="1920,60 1780,110 1730,80 1600,180 1550,160 1400,320 1300,380 1200,440" stroke="#FFFFFF" stroke-width="2" />
    <!-- Secondary Branches -->
    <polyline points="1730,80 1660,40 1590,70" stroke="#0284C7" stroke-width="3" />
    <polyline points="1550,160 1480,110 1430,140 1340,220" stroke="#38BDF8" stroke-width="3.5" />
    <polyline points="1400,320 1330,270 1260,300" stroke="#BAE6FD" stroke-width="2.5" />
  </g>

  <!-- CORNER 4: BOTTOM-RIGHT (MAELSTROM - Toxic Teal Wind Lightning) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="miter" filter="url(#plasmaBloomSoft)">
    <!-- Major Inflow Bolts -->
    <polyline points="1920,1020 1770,960 1710,990 1580,880 1520,910 1380,760 1280,700 1190,640" stroke="url(#maelstromBolt)" stroke-width="6" />
    <polyline points="1920,1020 1770,960 1710,990 1580,880 1520,910 1380,760 1280,700 1190,640" stroke="#FFFFFF" stroke-width="2" />
    <!-- Secondary Branches -->
    <polyline points="1710,990 1630,1040 1560,1000" stroke="#0D9488" stroke-width="3" />
    <polyline points="1520,910 1460,970 1390,940 1320,840" stroke="#2DD4BF" stroke-width="3.5" />
    <polyline points="1380,760 1300,800 1240,760" stroke="#5EEAD4" stroke-width="2.5" />
  </g>

  <!-- ========================================================
       3. EQUATORIAL PLASMA STREAMS (Colliding Head-On)
       ======================================================== -->
  <!-- Left Crimson/Orange Main Plasma Trunk -->
  <g filter="url(#plasmaBloomIntense)">
    <path d="M 0 540 Q 250 490 480 540 T 730 540" fill="none" stroke="url(#redBeamGrad)" stroke-width="28" stroke-linecap="round" />
    <path d="M 0 540 Q 250 510 480 540 T 730 540" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
  </g>
  <!-- Left Violent Lightning Spine Filaments -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="miter" filter="url(#plasmaBloomSoft)">
    <polyline points="0,540 160,510 240,560 380,520 490,570 610,520 730,540" stroke="#FFFFFF" stroke-width="4.5" />
    <polyline points="120,530 200,470 290,520 370,480 470,530" stroke="#F87171" stroke-width="3" />
    <polyline points="180,550 270,610 360,560 480,610 590,550" stroke="#EF4444" stroke-width="3" />
  </g>

  <!-- Right Electric Blue/Cyan Main Plasma Trunk -->
  <g filter="url(#plasmaBloomIntense)">
    <path d="M 1920 540 Q 1670 490 1440 540 T 1190 540" fill="none" stroke="url(#blueBeamGrad)" stroke-width="28" stroke-linecap="round" />
    <path d="M 1920 540 Q 1670 510 1440 540 T 1190 540" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
  </g>
  <!-- Right Violent Lightning Spine Filaments -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="miter" filter="url(#plasmaBloomSoft)">
    <polyline points="1920,540 1760,510 1680,560 1540,520 1430,570 1310,520 1190,540" stroke="#FFFFFF" stroke-width="4.5" />
    <polyline points="1800,530 1720,470 1630,520 1550,480 1450,530" stroke="#BAE6FD" stroke-width="3" />
    <polyline points="1740,550 1650,610 1560,560 1440,610 1330,550" stroke="#38BDF8" stroke-width="3" />
  </g>

  <!-- ========================================================
       4. THE SPHERICAL CLASH RING (The Central Plasma Rift)
       ======================================================== -->
  
  <!-- Outer Energy Confinement Ring Backglow -->
  <ellipse cx="960" cy="540" rx="370" ry="370" fill="none" stroke="#7E22CE" stroke-width="32" opacity="0.3" filter="url(#plasmaBloomIntense)" />

  <!-- LEFT HALF OF THE SPHERE: RED/CRIMSON ARCING ELECTRIC BORDER -->
  <g fill="none" stroke-linecap="round" filter="url(#plasmaBloomIntense)">
    <!-- Broad Ambient Arc -->
    <path d="M 960 180 A 360 360 0 0 0 960 900" stroke="#DC2626" stroke-width="18" opacity="0.8" />
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="miter" filter="url(#plasmaBloomSoft)">
    <!-- Intense Lightning Arcs Wrapping Left Boundary -->
    <path d="M 960 180 C 740 210 600 360 600 540 C 600 720 740 870 960 900" stroke="#EF4444" stroke-width="8" />
    <path d="M 960 180 C 740 210 600 360 600 540 C 600 720 740 870 960 900" stroke="#FFFFFF" stroke-width="3.5" />
    <!-- Secondary Outer Writhing Arcs -->
    <path d="M 930 200 C 750 250 630 380 630 540 C 630 700 750 830 930 880" stroke="#F87171" stroke-width="4.5" />
    <path d="M 880 230 C 720 300 660 410 660 540 C 660 670 720 780 880 850" stroke="#FEF08A" stroke-width="3" />
  </g>

  <!-- RIGHT HALF OF THE SPHERE: BLUE/CYAN ARCING ELECTRIC BORDER -->
  <g fill="none" stroke-linecap="round" filter="url(#plasmaBloomIntense)">
    <!-- Broad Ambient Arc -->
    <path d="M 960 180 A 360 360 0 0 1 960 900" stroke="#0284C7" stroke-width="18" opacity="0.8" />
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="miter" filter="url(#plasmaBloomSoft)">
    <!-- Intense Lightning Arcs Wrapping Right Boundary -->
    <path d="M 960 180 C 1180 210 1320 360 1320 540 C 1320 720 1180 870 960 900" stroke="#38BDF8" stroke-width="8" />
    <path d="M 960 180 C 1180 210 1320 360 1320 540 C 1320 720 1180 870 960 900" stroke="#FFFFFF" stroke-width="3.5" />
    <!-- Secondary Outer Writhing Arcs -->
    <path d="M 990 200 C 1170 250 1290 380 1290 540 C 1290 700 1170 830 990 880" stroke="#BAE6FD" stroke-width="4.5" />
    <path d="M 1040 230 C 1200 300 1260 410 1260 540 C 1260 670 1200 780 1040 850" stroke="#FFFFFF" stroke-width="3" />
  </g>

  <!-- TOP & BOTTOM CONVERGENCE CAPS: VIOLET & MAGENTA COLLISION CRESTS -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="miter" filter="url(#plasmaBloomIntense)">
    <!-- Top Collision Crown -->
    <path d="M 820 220 Q 960 140 1100 220" stroke="#C084FC" stroke-width="10" />
    <path d="M 860 200 Q 960 160 1060 200" stroke="#FFFFFF" stroke-width="4" />
    <path d="M 900 170 Q 960 130 1020 170" stroke="#E879F9" stroke-width="6" />

    <!-- Bottom Collision Crown -->
    <path d="M 820 860 Q 960 940 1100 860" stroke="#C084FC" stroke-width="10" />
    <path d="M 860 880 Q 960 920 1060 880" stroke="#FFFFFF" stroke-width="4" />
    <path d="M 900 910 Q 960 950 1020 910" stroke="#E879F9" stroke-width="6" />
  </g>

  <!-- ========================================================
       5. INTERIOR SPHERE DISCHARGE (Intersecting Cross-Lightning)
       ======================================================== -->
  <!-- Low-opacity internal filaments so the 6x5 reel board remains high-contrast -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="miter" opacity="0.7" filter="url(#plasmaBloomSoft)">
    <!-- Horizontal Cross-Sparks (Left to Right Center Clash) -->
    <polyline points="630,540 720,520 800,560 960,540 1120,520 1200,560 1290,540" stroke="#FFFFFF" stroke-width="3" />
    <polyline points="660,510 770,550 880,510 960,540 1040,570 1150,530 1260,570" stroke="#E879F9" stroke-width="2.5" />
    
    <!-- Diagonal Interior Field Arcs -->
    <polyline points="740,360 840,440 960,540 1080,640 1180,720" stroke="#38BDF8" stroke-width="2" opacity="0.6" />
    <polyline points="740,720 840,640 960,540 1080,440 1180,360" stroke="#F87171" stroke-width="2" opacity="0.6" />
  </g>

  <!-- ========================================================
       6. FOREGROUND DISCHARGE SPARKS & IONIZED NODES
       ======================================================== -->
  <g filter="url(#plasmaBloomSoft)">
    <!-- Center Collision Node -->
    <circle cx="960" cy="540" r="7" fill="#FFFFFF" />
    <circle cx="960" cy="540" r="14" fill="#C084FC" opacity="0.7" />

    <!-- Equator Clash Junctions -->
    <circle cx="600" cy="540" r="6" fill="#FFFFFF" />
    <circle cx="600" cy="540" r="12" fill="#EF4444" opacity="0.8" />
    <circle cx="1320" cy="540" r="6" fill="#FFFFFF" />
    <circle cx="1320" cy="540" r="12" fill="#38BDF8" opacity="0.8" />

    <!-- Top & Bottom Crown Nodes -->
    <circle cx="960" cy="180" r="6" fill="#FFFFFF" />
    <circle cx="960" cy="900" r="6" fill="#FFFFFF" />

    <!-- Floating Plasma Sparks -->
    <circle cx="480" cy="460" r="3.5" fill="#FEF08A" />
    <circle cx="520" cy="620" r="4" fill="#EF4444" />
    <circle cx="1440" cy="460" r="3.5" fill="#BAE6FD" />
    <circle cx="1400" cy="620" r="4" fill="#38BDF8" />
    <circle cx="820" cy="300" r="3" fill="#E879F9" />
    <circle cx="1100" cy="300" r="3" fill="#38BDF8" />
    <circle cx="820" cy="780" r="3" fill="#A855F7" />
    <circle cx="1100" cy="780" r="3" fill="#5EEAD4" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Forest Fire Bloom Filter -->
    <filter id="fireGlowFS" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Deep Smoke & Ash Night Sky -->
    <radialGradient id="smokeSky" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2D0606" />
      <stop offset="45%" stop-color="#140202" />
      <stop offset="85%" stop-color="#050000" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Blazing Crown Fire Canopy Gradient -->
    <linearGradient id="crownFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7F1D1D" />
      <stop offset="25%" stop-color="#DC2626" />
      <stop offset="55%" stop-color="#EA580C" />
      <stop offset="85%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#FFFBEB" />
    </linearGradient>

    <!-- Charred Pine Tree Bark -->
    <linearGradient id="burntBark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="50%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <!-- Glowing Timber Root Gradient -->
    <linearGradient id="smolderRoot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#450A0A" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
  </defs>

  <!-- Canvas Deep Ash Sky -->
  <rect width="1920" height="1080" fill="url(#smokeSky)" />

  <!-- ==========================================
       1. DISTANT FIREWALL & SMOKE HAZE
       ========================================== -->
  <ellipse cx="960" cy="540" rx="750" ry="400" fill="#DC2626" opacity="0.16" filter="url(#fireGlowFS)" />
  <circle cx="280" cy="480" r="380" fill="#EA580C" opacity="0.18" filter="url(#fireGlowFS)" />
  <circle cx="1640" cy="480" r="380" fill="#EA580C" opacity="0.18" filter="url(#fireGlowFS)" />

  <!-- Distant Background Burning Forest Ridge Silhouettes -->
  <path d="M -50 780 L 80 620 L 140 700 L 240 560 L 320 680 L 460 520 L 580 660 L 720 540 L 860 690 L 960 580 L 1080 700 L 1220 550 L 1360 670 L 1490 530 L 1620 680 L 1740 570 L 1860 690 L 1970 590 L 1970 820 L -50 820 Z" 
        fill="#180303" stroke="#000000" stroke-width="6" />

  <!-- Distant Crown Flames on Ridge -->
  <path d="M 60 640 Q 80 570 100 640 M 220 580 Q 240 500 260 580 M 440 540 Q 460 460 480 540 M 1200 570 Q 1220 490 1240 570 M 1470 550 Q 1490 470 1510 550 M 1720 590 Q 1740 510 1760 590" 
        stroke="#FACC15" stroke-width="4" fill="none" filter="url(#fireGlowFS)" />

  <!-- ==========================================
       2. LEFT FLANK: ENGULFED BLAZING PINES & TIMBER
       ========================================== -->
  <!-- Left Huge Crown Fire Mass -->
  <path d="M -50 200 C 140 160 320 280 260 560 C 380 440 440 620 340 840 L -50 900 Z" 
        fill="url(#crownFlame)" opacity="0.85" filter="url(#fireGlowFS)" />

  <!-- Foreground Charred Tree 1 (Ancient Burned Pine Trunk) -->
  <polygon points="120,1100 160,340 220,340 280,1100" fill="url(#burntBark)" stroke="#000000" stroke-width="10" stroke-linejoin="round" />
  <!-- Tree 1 Burning Branch Limbs -->
  <path d="M 170 460 Q 90 420 30 450" stroke="#000000" stroke-width="12" fill="none" stroke-linecap="round" />
  <path d="M 210 520 Q 320 470 390 510" stroke="#000000" stroke-width="10" fill="none" stroke-linecap="round" />
  <path d="M 180 640 Q 80 600 10 660" stroke="#000000" stroke-width="14" fill="none" stroke-linecap="round" />
  <path d="M 230 720 Q 340 680 420 740" stroke="#000000" stroke-width="12" fill="none" stroke-linecap="round" />

  <!-- Flames Wrapping Around Tree 1 Limbs -->
  <path d="M 120 450 C 70 380 40 420 20 450 C 40 410 80 410 120 450 Z" fill="url(#crownFlame)" filter="url(#fireGlowFS)" />
  <path d="M 250 510 C 320 440 360 480 390 510 C 350 470 300 480 250 510 Z" fill="url(#crownFlame)" filter="url(#fireGlowFS)" />
  <path d="M 110 640 C 50 570 30 620 0 660 C 30 610 70 610 110 640 Z" fill="url(#crownFlame)" filter="url(#fireGlowFS)" />

  <!-- Burning Interior Fissures Inside Left Tree Trunk -->
  <path d="M 190 380 L 195 560 L 180 720 L 210 940 L 190 1080" 
        fill="none" stroke="#FDE047" stroke-width="4" stroke-linecap="round" filter="url(#fireGlowFS)" />
  <line x1="195" y1="560" x2="260" y2="520" stroke="#F97316" stroke-width="3" filter="url(#fireGlowFS)" />
  <line x1="180" y1="720" x2="110" y2="680" stroke="#F97316" stroke-width="3" filter="url(#fireGlowFS)" />

  <!-- Secondary Charred Pine Spire (Left Background) -->
  <polygon points="20,950 60,220 90,220 140,950" fill="url(#burntBark)" stroke="#000000" stroke-width="7" stroke-linejoin="round" />
  <polygon points="60,220 75,120 90,220" fill="#FACC15" stroke="#000000" stroke-width="3" filter="url(#fireGlowFS)" />

  <!-- ==========================================
       3. RIGHT FLANK: ROARING FOREST WILDFIRE
       ========================================== -->
  <!-- Right Huge Crown Fire Mass -->
  <path d="M 1970 200 C 1780 160 1600 280 1660 560 C 1540 440 1480 620 1580 840 L 1970 900 Z" 
        fill="url(#crownFlame)" opacity="0.85" filter="url(#fireGlowFS)" />

  <!-- Foreground Charred Tree 2 (Ancient Burned Pine Trunk) -->
  <polygon points="1800,1100 1760,340 1700,340 1640,1100" fill="url(#burntBark)" stroke="#000000" stroke-width="10" stroke-linejoin="round" />
  <!-- Tree 2 Burning Branch Limbs -->
  <path d="M 1750 460 Q 1830 420 1890 450" stroke="#000000" stroke-width="12" fill="none" stroke-linecap="round" />
  <path d="M 1710 520 Q 1600 470 1530 510" stroke="#000000" stroke-width="10" fill="none" stroke-linecap="round" />
  <path d="M 1740 640 Q 1840 600 1910 660" stroke="#000000" stroke-width="14" fill="none" stroke-linecap="round" />
  <path d="M 1690 720 Q 1580 680 1500 740" stroke="#000000" stroke-width="12" fill="none" stroke-linecap="round" />

  <!-- Flames Wrapping Around Tree 2 Limbs -->
  <path d="M 1800 450 C 1850 380 1880 420 1900 450 C 1880 410 1840 410 1800 450 Z" fill="url(#crownFlame)" filter="url(#fireGlowFS)" />
  <path d="M 1670 510 C 1600 440 1560 480 1530 510 C 1570 470 1620 480 1670 510 Z" fill="url(#crownFlame)" filter="url(#fireGlowFS)" />
  <path d="M 1810 640 C 1870 570 1890 620 1920 660 C 1890 610 1850 610 1810 640 Z" fill="url(#crownFlame)" filter="url(#fireGlowFS)" />

  <!-- Burning Interior Fissures Inside Right Tree Trunk -->
  <path d="M 1730 380 L 1725 560 L 1740 720 L 1710 940 L 1730 1080" 
        fill="none" stroke="#FDE047" stroke-width="4" stroke-linecap="round" filter="url(#fireGlowFS)" />
  <line x1="1725" y1="560" x2="1660" y2="520" stroke="#F97316" stroke-width="3" filter="url(#fireGlowFS)" />
  <line x1="1740" y1="720" x2="1810" y2="680" stroke="#F97316" stroke-width="3" filter="url(#fireGlowFS)" />

  <!-- Secondary Charred Pine Spire (Right Background) -->
  <polygon points="1900,950 1860,220 1830,220 1780,950" fill="url(#burntBark)" stroke="#000000" stroke-width="7" stroke-linejoin="round" />
  <polygon points="1860,220 1845,120 1830,220" fill="#FACC15" stroke="#000000" stroke-width="3" filter="url(#fireGlowFS)" />

  <!-- ==========================================
       4. BURNING FOREST FLOOR & SMOLDERING ROOTS
       ========================================== -->
  <!-- Burnt Forest Ground Mound -->
  <path d="M -50 940 Q 480 890 960 950 Q 1440 890 1970 940 L 1970 1130 L -50 1130 Z" 
        fill="#120202" stroke="#000000" stroke-width="10" />

  <!-- Smoldering Tree Root Network Glowing Beneath Ground -->
  <g fill="none" stroke="url(#smolderRoot)" stroke-linecap="round" filter="url(#fireGlowFS)">
    <!-- Left Roots -->
    <path d="M 160 980 Q 280 960 380 1010 Q 460 1030 540 990" stroke-width="7" />
    <path d="M 220 1010 Q 310 1040 410 1060" stroke-width="4.5" />
    <!-- Center Floor Smolder -->
    <path d="M 820 970 Q 960 950 1100 980" stroke-width="6" />
    <!-- Right Roots -->
    <path d="M 1760 980 Q 1640 960 1540 1010 Q 1460 1030 1380 990" stroke-width="7" />
    <path d="M 1700 1010 Q 1610 1040 1510 1060" stroke-width="4.5" />
  </g>

  <!-- Fallen Charred Burning Logs -->
  <polygon points="420,980 620,950 630,975 430,1005" fill="url(#burntBark)" stroke="#000000" stroke-width="5" stroke-linejoin="round" />
  <polygon points="1500,980 1300,950 1290,975 1490,1005" fill="url(#burntBark)" stroke="#000000" stroke-width="5" stroke-linejoin="round" />

  <!-- ==========================================
       5. COMIC INK CHISEL HATCHES & BARK TEXTURE
       ========================================== -->
  <g stroke="#000000" stroke-width="4" stroke-linecap="round">
    <!-- Left Tree Bark Inking -->
    <line x1="180" y1="420" x2="195" y2="450" />
    <line x1="210" y1="620" x2="225" y2="650" />
    <line x1="170" y1="840" x2="190" y2="870" />
    <!-- Right Tree Bark Inking -->
    <line x1="1740" y1="420" x2="1725" y2="450" />
    <line x1="1710" y1="620" x2="1695" y2="650" />
    <line x1="1750" y1="840" x2="1730" y2="870" />
  </g>

  <!-- ==========================================
       6. FLYING WOOD ASH & RISING PINE NEEDLE EMBERS
       ========================================== -->
  <g filter="url(#fireGlowFS)">
    <!-- Swirling Embers (Left Side) -->
    <circle cx="260" cy="380" r="5" fill="#FEF08A" />
    <circle cx="340" cy="290" r="4" fill="#F97316" />
    <circle cx="160" cy="180" r="3.5" fill="#FFFFFF" />
    <circle cx="410" cy="460" r="4.5" fill="#FACC15" />
    <circle cx="280" cy="620" r="3.5" fill="#EF4444" />
    
    <!-- Swirling Embers (Right Side) -->
    <circle cx="1660" cy="380" r="5" fill="#FEF08A" />
    <circle cx="1580" cy="290" r="4" fill="#F97316" />
    <circle cx="1760" cy="180" r="3.5" fill="#FFFFFF" />
    <circle cx="1510" cy="460" r="4.5" fill="#FACC15" />
    <circle cx="1640" cy="620" r="3.5" fill="#EF4444" />

    <!-- Center Screen Drifting Ash Flakes -->
    <circle cx="960" cy="420" r="2.5" fill="#FEF08A" opacity="0.8" />
    <circle cx="820" cy="320" r="3" fill="#F97316" opacity="0.7" />
    <circle cx="1100" cy="340" r="3" fill="#F97316" opacity="0.7" />
    <circle cx="960" cy="920" r="5.5" fill="#FEF08A" />
  </g>
</svg>

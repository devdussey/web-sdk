<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <filter id="iceGlowFS" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="permafrostAbyss" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#061826" />
      <stop offset="50%" stop-color="#020B12" />
      <stop offset="100%" stop-color="#000407" />
    </radialGradient>

    <linearGradient id="glacierSpireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#BAE6FD" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#082F49" />
    </linearGradient>

    <linearGradient id="frozenGranite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Deep Blue Permafrost Abyss -->
  <rect width="1920" height="1080" fill="url(#permafrostAbyss)" />

  <!-- GLACIAL AMBIENT FROST MIST BLOOMS -->
  <circle cx="280" cy="540" r="420" fill="#0284C7" opacity="0.18" filter="url(#iceGlowFS)" />
  <circle cx="1640" cy="540" r="420" fill="#0284C7" opacity="0.18" filter="url(#iceGlowFS)" />
  <circle cx="960" cy="980" r="350" fill="#38BDF8" opacity="0.15" filter="url(#iceGlowFS)" />

  <!-- TOP CEILING: COLOSSAL HANGING ICICLE STALACTITES -->
  <polygon points="120,-30 200,320 280,-30" fill="url(#glacierSpireGrad)" stroke="#000000" stroke-width="8" stroke-linejoin="round" />
  <polygon points="260,-30 330,240 400,-30" fill="url(#glacierSpireGrad)" stroke="#000000" stroke-width="7" stroke-linejoin="round" />
  <polygon points="1520,-30 1590,240 1660,-30" fill="url(#glacierSpireGrad)" stroke="#000000" stroke-width="7" stroke-linejoin="round" />
  <polygon points="1640,-30 1720,320 1800,-30" fill="url(#glacierSpireGrad)" stroke="#000000" stroke-width="8" stroke-linejoin="round" />

  <!-- Overhang Rock Ledge -->
  <polygon points="-50,-50 560,-50 480,110 240,80 -50,140" fill="url(#frozenGranite)" stroke="#000000" stroke-width="9" stroke-linejoin="round" />
  <polygon points="1970,-50 1360,-50 1440,110 1680,80 1970,140" fill="url(#frozenGranite)" stroke="#000000" stroke-width="9" stroke-linejoin="round" />

  <!-- FLANKING GIANT GLACIER MONOLITHS (Left & Right Walls) -->
  <!-- Left Glacier Ridge -->
  <polygon points="-50,220 240,420 160,820 -50,1020" fill="url(#glacierSpireGrad)" stroke="#000000" stroke-width="10" stroke-linejoin="round" />
  <polygon points="160,820 340,680 260,1130 -50,1130" fill="url(#frozenGranite)" stroke="#000000" stroke-width="10" stroke-linejoin="round" />
  <polygon points="240,420 380,560 310,720 160,820" fill="#BAE6FD" opacity="0.6" stroke="#000000" stroke-width="7" stroke-linejoin="round" />

  <!-- Right Glacier Ridge -->
  <polygon points="1970,220 1680,420 1760,820 1970,1020" fill="url(#glacierSpireGrad)" stroke="#000000" stroke-width="10" stroke-linejoin="round" />
  <polygon points="1760,820 1580,680 1660,1130 1970,1130" fill="url(#frozenGranite)" stroke="#000000" stroke-width="10" stroke-linejoin="round" />
  <polygon points="1680,420 1540,560 1610,720 1760,820" fill="#BAE6FD" opacity="0.6" stroke="#000000" stroke-width="7" stroke-linejoin="round" />

  <!-- BOTTOM FROZEN PERMAFROST CRUST & ICE SPIRES -->
  <polygon points="380,1130 460,940 540,1130" fill="url(#glacierSpireGrad)" stroke="#000000" stroke-width="8" stroke-linejoin="round" />
  <polygon points="1380,1130 1460,940 1540,1130" fill="url(#glacierSpireGrad)" stroke="#000000" stroke-width="8" stroke-linejoin="round" />
  <polygon points="480,1130 960,1020 1440,1130" fill="url(#frozenGranite)" stroke="#000000" stroke-width="9" stroke-linejoin="round" />

  <!-- RUNIC CYAN FRACTURES (Glacial Ice Glow Lines) -->
  <g fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" filter="url(#iceGlowFS)">
    <!-- Left Wall Runes -->
    <path d="M 60 380 L 140 440 L 120 540 L 220 600" />
    <path d="M 120 740 L 190 800 L 160 920" />
    <!-- Right Wall Runes -->
    <path d="M 1860 380 L 1780 440 L 1800 540 L 1700 600" />
    <path d="M 1800 740 L 1730 800 L 1760 920" />
  </g>

  <!-- BLINDING WHITE FACET SPECULAR RIDGES -->
  <g stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" filter="url(#iceGlowFS)">
    <line x1="200" y1="30" x2="200" y2="310" />
    <line x1="1720" y1="30" x2="1720" y2="310" />
    <line x1="240" y1="420" x2="160" y2="820" />
    <line x1="1680" y1="420" x2="1760" y2="820" />
  </g>

  <!-- FLOATING FROST PARTICLES & DIAMOND DUST -->
  <g filter="url(#iceGlowFS)">
    <circle cx="310" cy="380" r="4.5" fill="#FFFFFF" />
    <circle cx="220" cy="580" r="3.5" fill="#BAE6FD" />
    <circle cx="1610" cy="380" r="4.5" fill="#FFFFFF" />
    <circle cx="1700" cy="580" r="3.5" fill="#BAE6FD" />
    <circle cx="960" cy="980" r="5" fill="#FFFFFF" />
    <circle cx="460" cy="920" r="4" fill="#38BDF8" />
    <circle cx="1460" cy="920" r="4" fill="#38BDF8" />
  </g>
</svg>
